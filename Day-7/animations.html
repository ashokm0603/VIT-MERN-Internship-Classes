<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            text-align: center;
            animation-name: scaling;
            animation-duration: 4s;
            animation-iteration-count: 2;
        }


        img {
            height: 150px;
            width: 150px;
            animation-name: rotate;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            border-radius: 50%;
        }


        div {
            height: 150px;
            width: 150px;
            border-top: 10px solid red;
            border-bottom: 10px solid blue;
            border-right: 10px solid magenta;
            border-radius: 50%;
            animation-name: rotate;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-delay: 5s;
        }


        @keyframes rotate {
            0%{
                transform: translate(500px);
                background-color: red;
            }
            50% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
                background-color: green;
            }
        }




        @keyframes scaling {
            from {
                color: red;
                transform: scale(0);
            }

            to {
                color: mediumspringgreen;
                transform: scale(2);
                text-decoration: underline solid red;
            }
        }
    </style>
</head>

<body>

    <img src="https://images.unsplash.com/photo-1631631480669-535cc43f2327?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8YmFja2dyb3VuZCUyMGltYWdlfGVufDB8fDB8fHww"

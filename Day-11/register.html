<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <input id="searchInput" type="text" placeholder="Enter any text">

    <form action="">
        <fieldset>
            <label for="">Name </label>
            <input type="text" id="name" placeholder="Enter Name"> <br><br>
            <label for="">Email </label>
            <input type="email" id="email" placeholder="Enter email"> <br><br>
            <label for="">Password </label>
            <input type="password" id="password" placeholder="Enter Password"> <br><br>
            <label for="">Gender </label>
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
            <input type="radio" name="gender" value="Others"> Others

            <br><br>
            <button type="submit">Register</button>
            <button type="reset">Cancel</button>
        </fieldset>

    </form>
    <script>




        let input = document.getElementById('searchInput');
        input.onchange = () => {
            console.log(input.value);
        }


        let form = document.querySelector("form");
        let body = document.querySelector('body');

        form.addEventListener('submit', (e) => {
            e.preventDefault()
            let Name = document.getElementById("name")
            let Email = document.getElementById("email")
            let Password = document.getElementById("password")
            let ReadGender = document.createElement('h5')

            let Gender = document.getElementsByName('gender')
            Gender.forEach((gender) => {
                if (gender.checked) {
                    ReadGender.innerText = `Gender :${gender.value}`
                    localStorage.setItem("Email", gender.value);

                }
            })


            //logic to display in same web page

            let ReadName = document.createElement('h5')
            let ReadEmail = document.createElement('h5')
            let ReadPassword = document.createElement('h5')
            ReadName.innerText = `Name :${Name.value}`
            ReadEmail.innerText = `Email :${Email.value}`
            ReadPassword.innerText = `Password :${Password.value}`
            body.appendChild(ReadName)
            body.appendChild(ReadEmail)
            body.appendChild(ReadPassword)
            body.appendChild(ReadGender)


            //logic to store data localstorage
            localStorage.setItem("Name", Name.value);
            localStorage.setItem("Email", Email.value);
            localStorage.setItem("Password", Password.value);

        })

    </script>
</body>

</html>
